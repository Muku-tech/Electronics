{% extends 'base.html' %}

{% block title %}Add to Cart{% endblock %}

{% block content %}
<body>
  

<div class="container">
    <div class="alert alert-success mt-4" role="alert">
        <div class="alert-content">
            <div class="alert-icon">
                <i class="bi bi-check-circle"></i>
            </div>
            <h3 class="mb-3">Product Added to Cart Successfully!</h3>
            <p>Your item has been successfully added to your cart. You can continue shopping or proceed to checkout.</p>
            <div class="button-group mt-4">
                <a href="{% url 'ecomapp:all products' %}" class="btn btn-primary">
                    <i class="bi bi-arrow-left-circle"></i> Continue Shopping
                </a>
                <a href="{% url 'ecomapp:mycart' %}" class="btn btn-secondary">
                    <i class="bi bi-cart-check"></i> View Cart
                </a>
            </div>
        </div>
    </div>
</div>
</body>

<style>
/* ===== Page Background ===== */
body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

/* ===== Container ===== */
.container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 90vh;
}

/* ===== Alert Card ===== */
.alert {
    max-width: 650px;
    width: 100%;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 40px 30px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #eaffea;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    animation: scaleFade 0.5s ease-in-out;
}

/* ===== Animation ===== */
@keyframes scaleFade {
    from {
        opacity: 0;
        transform: scale(0.9);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* ===== Icon ===== */
.alert-icon {
    font-size: 4rem;
    color: #4ade80;
    margin-bottom: 15px;
    animation: pop 1.2s infinite alternate;
}

@keyframes pop {
    from { transform: scale(1); }
    to { transform: scale(1.1); }
}

/* ===== Headings ===== */
.alert h3 {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 12px;
    color: #dcfce7;
}

.alert p {
    font-size: 1rem;
    color: #d1fae5;
    opacity: 0.95;
}

/* ===== Button Group ===== */
.button-group {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-top: 30px;
    flex-wrap: wrap;
}

/* ===== Buttons ===== */
.btn {
    padding: 12px 24px;
    font-size: 0.9rem;
    border-radius: 50px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
}

/* Continue Shopping */
.btn-primary {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border: none;
    color: #ffffff;
}

.btn-primary:hover {
    background: linear-gradient(135deg, #16a34a, #15803d);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
}

/* View Cart */
.btn-secondary {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    border: none;
    color: #ffffff;
}

.btn-secondary:hover {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
}

/* ===== Responsive ===== */
@media (max-width: 576px) {
    .alert {
        padding: 30px 20px;
    }
    .alert h3 {
        font-size: 1.5rem;
    }
}
</style>

{% endblock %}
